apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mongo-ent.fullname" . }}
spec:
  serviceName: {{ include "mongo-ent.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "mongo-ent.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "mongo-ent.name" . }}
    spec:
      initContainers:
      - name: fix-keyfile-permissions
        image: registry.access.redhat.com/ubi8/ubi-minimal
        command:
          - sh
          - -c
          - |
            cp /readonly/keyfile /writable/keyfile && chmod 400 /writable/keyfile
        volumeMounts:
        - name: keyfile-volume
          mountPath: /readonly
        - name: keyfile-workaround
          mountPath: /writable
      containers:
      - name: mongod
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        command: ["mongod", "--config", "/etc/mongo/mongod.conf"]
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: data-volume
          mountPath: /data/db
        - name: config-volume
          mountPath: /etc/mongo
        - name: keyfile-workaround
          mountPath: /etc/secrets
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: {{ include "mongo-ent.fullname" . }}-conf
      - name: keyfile-volume
        secret:
          secretName: {{ include "mongo-ent.fullname" . }}-keyfile
      - name: keyfile-workaround
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data-volume
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: {{ .Values.persistence.storageClass }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}

