apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mongo-ent.fullname" . }}-conf
data:
  mongod.conf: |
    storage:
      dbPath: /data/db
    net:
      bindIp: 0.0.0.0
      port: 27017
    security:
      authorization: enabled
      keyFile: /etc/secrets/keyfile
    replication:
      replSetName: rs0

